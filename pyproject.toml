[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slangchain"
version = "0.1.0"
description = "Scratch and pretrained time-conditioned slang models for teaching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.12,<2",
  "safetensors>=0.7,<1",
  "torch>=2.6,<3",
  "transformers>=5.16,<6",
]

[project.scripts]
slangchain = "slangchain.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slangchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
