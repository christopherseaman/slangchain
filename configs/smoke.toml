[data]
path = "data/processed/toy.jsonl"
train_through = 2022
validation_through = 2023

[model]
context_length = 128
embed_dim = 64
heads = 4
layers = 2
dropout = 0.1
year_origin = 2020.0
year_scale = 5.0

[training]
output_dir = "artifacts/smoke"
batch_size = 8
steps = 12
learning_rate = 0.001
weight_decay = 0.01
gradient_clip = 1.0
eval_interval = 6
eval_batches = 4
log_interval = 3
seed = 42
num_workers = 0
mixed_precision = "no"

