[experiment]
mode = "full"

[data]
source = "data/raw/UrbanDictionary_04-2026.db"
packed_dir = "data/processed/qwen35-full-2048"
train_through = 2023
validation_through = 2024
tokenizer_id = "Qwen/Qwen3.5-0.8B-Base"
tokenizer_revision = "dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68"
